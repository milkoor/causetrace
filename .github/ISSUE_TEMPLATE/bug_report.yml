name: Bug Report
description: Report something that isn't working as expected
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent
      description: Which agent were you using? (Claude Code, OpenCode, Aider, etc.)
      placeholder: e.g. Claude Code

  - type: textarea
    id: trace
    attributes:
      label: Trace output
      description: Paste sanitized causetrace output or the error. Remove credentials, prompts, private paths, and tool output before submitting.
      render: text

  - type: input
    id: version
    attributes:
      label: Causetrace version
      description: Output of `python -m pip show causetrace` or the commit SHA.
      placeholder: e.g. 0.1.2 or 0bb39ce

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command used and the minimum trace shape needed to reproduce the issue.

  - type: textarea
    id: schema
    attributes:
      label: Schema pressure
      description: Did this trace expose something the current schema can't express well? (optional, for pressure-log.md)
