[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "causetrace"
version = "0.2.5"
description = "AI coding agent observability and causal tracing for Claude Code, Codex CLI, and OpenCode"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

authors = [
    {name = "milkoor"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

keywords = [
    "agent", "trace", "observability", "causality", "llm",
    "claude", "claude-code", "codex-cli", "opencode", "coding-agent",
    "agent-observability", "runtime", "monitoring", "debugging",
]

[project.urls]
Homepage = "https://github.com/milkoor/causetrace"
Repository = "https://github.com/milkoor/causetrace"
BugTracker = "https://github.com/milkoor/causetrace/issues"
Documentation = "https://github.com/milkoor/causetrace#quick-start"
Changelog = "https://github.com/milkoor/causetrace/blob/main/CHANGELOG.md"
Releases = "https://github.com/milkoor/causetrace/releases"

[project.scripts]
causetrace = "causetrace.cli:cli"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["causetrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
