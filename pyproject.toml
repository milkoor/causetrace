[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causetrace"
version = "0.1.0"
description = "Agent Runtime Trace SDK — observe, replay, understand agent behavior"
requires-python = ">=3.10"

[project.scripts]
causetrace = "causetrace.cli:cli"

[tool.setuptools.packages.find]
include = ["causetrace*"]
