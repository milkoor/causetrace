<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">causetrace converts agent tool logs into causal explanations</title>
  <desc id="desc">A flat timeline on the left becomes a causal tree and a why chain on the right.</desc>
  <rect width="1200" height="560" rx="20" fill="#0d1117"/>
  <text x="52" y="58" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">AI coding agent trace: from when to why</text>
  <text x="52" y="92" fill="#8b949e" font-family="Arial, sans-serif" font-size="18">causetrace demo  |  append-only JSONL  |  Claude Code / Codex CLI / OpenCode</text>

  <rect x="52" y="130" width="430" height="366" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="170" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Flat timeline</text>
  <text x="80" y="205" fill="#8b949e" font-family="monospace" font-size="17">[00:01] Read(src/main.py)</text>
  <text x="80" y="239" fill="#8b949e" font-family="monospace" font-size="17">[00:02] Grep(FIXME)</text>
  <text x="80" y="273" fill="#8b949e" font-family="monospace" font-size="17">[00:03] Read(src/utils.py)</text>
  <text x="80" y="307" fill="#8b949e" font-family="monospace" font-size="17">[00:04] Read(test_utils.py)</text>
  <text x="80" y="341" fill="#8b949e" font-family="monospace" font-size="17">[00:05] Edit(src/utils.py)</text>
  <text x="80" y="375" fill="#8b949e" font-family="monospace" font-size="17">[00:06] Bash(pytest -x)</text>
  <rect x="80" y="414" width="356" height="50" rx="8" fill="#21262d"/>
  <text x="98" y="446" fill="#f85149" font-family="Arial, sans-serif" font-size="18">When is visible. Cause is missing.</text>

  <path d="M500 310 L548 310" stroke="#58a6ff" stroke-width="4"/>
  <path d="M540 300 L552 310 L540 320" fill="none" stroke="#58a6ff" stroke-width="4"/>

  <rect x="572" y="130" width="576" height="366" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="170" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Causal tree and root-cause trace</text>
  <text x="600" y="210" fill="#7ee787" font-family="monospace" font-size="17">Read(src/main.py)</text>
  <text x="628" y="244" fill="#58a6ff" font-family="monospace" font-size="17">+-- Grep(FIXME)</text>
  <text x="656" y="278" fill="#7ee787" font-family="monospace" font-size="17">+-- Read(src/utils.py)</text>
  <text x="600" y="318" fill="#7ee787" font-family="monospace" font-size="17">Read(test_utils.py)</text>
  <text x="684" y="352" fill="#d2a8ff" font-family="monospace" font-size="17">+-- Edit(src/utils.py) [fan-in]</text>
  <text x="712" y="386" fill="#ffa657" font-family="monospace" font-size="17">+-- Bash(pytest -x) TARGET</text>
  <rect x="600" y="414" width="510" height="50" rx="8" fill="#21262d"/>
  <text x="618" y="446" fill="#7ee787" font-family="Arial, sans-serif" font-size="18">why: Read -&gt; Grep -&gt; Read -&gt; Edit -&gt; Test</text>
</svg>
